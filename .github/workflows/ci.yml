name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Create .venv and install
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          $PY -m pip install --upgrade pip
          $PY -m pip install -e ".[build]"
          echo "PY=$PY" >> "$GITHUB_ENV"
      - name: Import comes from this checkout
        shell: bash
        run: $PY -c "import exam_trainer, inspect; print(inspect.getfile(exam_trainer))"
      - name: Unit tests
        shell: bash
        run: $PY -m unittest discover -s tests -v
      - name: Byte-compile
        shell: bash
        run: $PY -m compileall -q src tests
